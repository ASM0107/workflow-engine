name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workflow_engine
          POSTGRES_USER: engine_user
          POSTGRES_PASSWORD: engine_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://engine_user:engine_password@localhost:5432/workflow_engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          uv run ruff check .

      - name: Typecheck with mypy
        run: |
          uv run mypy backend/src tests

      - name: Run database migrations
        run: |
          uv run alembic upgrade head

      - name: Run test suite
        run: |
          uv run pytest --cov=workflow_engine --cov-report=term-missing
